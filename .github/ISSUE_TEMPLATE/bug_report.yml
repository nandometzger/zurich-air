name: Bug report
description: Something does not work as described.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        > [!WARNING]
        > **This page is public.** Before you paste anything below, remove **Wi-Fi network names and passwords**, **API keys** (such as `ZURICH_AIR_ADSB_LOL_KEY` from the `.env` file) and other private details, such as your home coordinates in `config.toml`.

        Thanks for taking the time to report this. The output of `zurich-air doctor` and the log answer most questions before they are asked.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what went wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `zurich-air doctor`
      description: "If it runs. On the Pi: `cd ~/zurich-air && .venv/bin/zurich-air doctor --config config.toml`"
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`journalctl -u zurich-air -e` shows the latest lines of the service log; to copy them: `journalctl -u zurich-air -n 100 --no-pager`. Or the output of the command that failed."
      render: text
  - type: input
    id: pi-model
    attributes:
      label: Raspberry Pi model
      placeholder: Raspberry Pi Zero 2 WH (or "none, mock display on a computer")
  - type: input
    id: display
    attributes:
      label: Display
      placeholder: Waveshare 4.2" e-paper module, 400x300
  - type: textarea
    id: picture
    attributes:
      label: Photo or preview (optional)
      description: For drawing problems, a photo of the panel or the mock display's `previews/latest.png`. Drag the image in here.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed Wi-Fi names and passwords, API keys and other private details from everything above.
          required: true
