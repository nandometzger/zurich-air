# Zurich Air — example configuration.
#
#   cp config.example.toml config.toml
#
# Every key is optional; omitted keys fall back to the built-in Zürich defaults.
# config.toml is git-ignored. Never put credentials in this file.

[location]
name = "Zurich"
latitude = 47.3769          # radar centre
longitude = 8.5417
timezone = "Europe/Zurich"  # used for the clock on the display

[airport]
code = "ZRH"                # label drawn next to the runway glyph
latitude = 47.458056
longitude = 8.548056
elevation_ft = 1416         # field elevation; slow reports just above it count as on the ground
# Runway thresholds [lat1, lon1, lat2, lon2]; leave empty for a generic airport marker.
runways = [
  [47.45890, 8.53747, 47.45660, 8.57045],  # 10/28
  [47.48310, 8.53473, 47.46130, 8.56446],  # 14/32
  [47.47560, 8.53595, 47.44540, 8.55673],  # 16/34
]

[radar]
range_km = 60               # radius of the outer ring
ring_step_km = 20           # spacing of the inner range rings
trails = true               # dotted history trail behind each aircraft

[display]
backend = "mock"            # "mock" writes PNGs, "waveshare" drives the e-paper panel
width = 400
height = 300
rotation = 0                # 0, 90, 180 or 270 — applied by the hardware backend
output_dir = "previews"     # where the mock backend writes PNGs
altitude_units = "aviation" # "aviation" (FL350 / 4500 ft) or "metric" (10 700 m)

[update]
interval_s = 60             # seconds between data fetches / display refreshes
stale_after_s = 300         # show "NO DATA SINCE …" once the last good fetch is this old
hide_after_s = 1800         # then clear radar and flight list and show "WAITING FOR DATA"
quiet_hours = "23:30-06:00" # local time, may cross midnight; "" to update all night
quiet_interval_s = 600      # seconds between updates during quiet hours

[aircraft]
featured = 5                # aircraft shown in the flight list (0–6)
max_altitude_ft = 60000
include_ground = false      # show taxiing / parked aircraft
stale_after_s = 60          # drop aircraft whose last position is older than this

[ranking]
# Which aircraft get a row in the flight list. Run `zurich-air explain` to see the scores.
# Arrivals and departures are inferred from altitude, vertical rate and track.
phase_radius_km = 40              # recognise arrivals and departures this close to the airport
arrival_max_altitude_ft = 10000   # arrivals: descending (or very low) below this
departure_max_altitude_ft = 15000 # departures: climbing below this
min_vertical_rate_fpm = 300       # slower climbs and descents count as level flight
max_track_offset_deg = 75         # how far the track may stray from the line to / from the airport

[ranking.weights]
# Points added to the score; emergencies always come first, LADD/PIA aircraft never appear.
arrival = 40                # full at the airport, half at phase_radius_km
departure = 40
notable_type = 30           # very large or rare: A380, 747, An-124, Beluga, C-17, A400M, MD-11
widebody = 10               # other widebodies
helicopter = 15
rescue = 15                 # air rescue callsigns (Rega, SAZ…)
military = 25
interesting = 15            # flagged as interesting in the aircraft database
low_altitude = 20           # full on the ground, nothing from 40 000 ft
near_centre = 10            # full at the radar centre, nothing at its edge
no_identity = -20           # neither callsign nor type: an uninformative row
featured_before = 15        # stickiness: a newcomer must beat an aircraft in the list by this

[provider]
# Tried in order; a source that fails or is rate limited is skipped until it recovers.
# "adsb_fi" (opendata.adsb.fi) and "adsb_lol" (api.adsb.lol) — see "Data sources" in the
# README for their terms. An optional adsb.lol API key is read from the environment
# variable ZURICH_AIR_ADSB_LOL_KEY, never from this file.
sources = ["adsb_fi", "adsb_lol"]
timeout_s = 10              # per request
