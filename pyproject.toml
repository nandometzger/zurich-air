[project]
name = "zurich-air"
version = "0.1.0"
description = "Minimalist Raspberry Pi e-paper flight tracker displaying live aircraft around Zürich."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/zurich_air/assets/fonts/OFL.txt"]
authors = [{ name = "Nando Metzger" }]
requires-python = ">=3.11"
dependencies = ["Pillow>=10.0"]
keywords = ["raspberry-pi", "e-paper", "ads-b", "aviation", "flight-tracker"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Homepage = "https://github.com/nandometzger/zurich-air"
Issues = "https://github.com/nandometzger/zurich-air/issues"

[project.scripts]
zurich-air = "zurich_air.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zurich_air"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
